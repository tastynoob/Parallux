[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallux"
version = "0.1.3"
description = "Python-controlled command submission runtime for local and SSH runners"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Parallux contributors" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
parallux = "parallux:main"

[tool.setuptools]
packages = ["parallux"]
